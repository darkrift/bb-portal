extend type Query {
  getAuthenticatedUser(userUUID: UUID!): AuthenticatedUser
  getBazelInvocation(invocationID: UUID!): BazelInvocation
  getBuild(buildUUID: UUID!): Build
  testSummaryStats(where: TestSummaryWhereInput): TestSummaryStats!
  getTarget(
    instanceName: String!
    label: String!
    aspect: String!
    targetKind: String!
  ): Target
}

type Profile {
  id: ID!
  name: String!
  digest: String!
  sizeInBytes: Int!
  digestFunction: String!
}

type TestSummaryStats {
  tests: Int!
  passed: Int!
  flaky: Int!
  failed: Int!
  incomplete: Int!
  noStatus: Int!
  runs: Int!
  attempts: Int!
  cached: Int!
}

extend type BazelInvocation {
  profile: Profile
  hasFailedActions: Boolean! @goField(forceResolver: true)
  hasActionsForTarget(targetID: ID!): Boolean! @goField(forceResolver: true)
  actionsForTarget(targetID: ID!): [Action!]! @goField(forceResolver: true)
}

extend type ConnectionMetadata {
  timeSinceLastConnectionMillis: Int! @goField(forceResolver: true)
}

extend type Target {
  invocationTargetsTotalDurationMillis: Int! @goField(forceResolver: true)
}
